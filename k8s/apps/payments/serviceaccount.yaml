apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments
  annotations:
    # client_id of the managed identity that may SIGN with the Key Vault key.
    # Substitute __KV_READER_CLIENT_ID__ at apply time (scripts/deploy_payments.sh):
    #   terraform -chdir=terraform output -raw kv_reader_client_id
    #
    # Phase 3 (Terraform) must also add, on that same MI:
    #   - a federated credential for subject
    #       system:serviceaccount:payments:payments-api
    #   - key_permissions = ["Get","Sign","Verify"] on the Key Vault access policy
    azure.workload.identity/client-id: "__KV_READER_CLIENT_ID__"
