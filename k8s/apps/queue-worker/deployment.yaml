apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: demo
spec:
  replicas: 0 # KEDA owns this; starting at 0 proves scale-to-zero
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      containers:
        - name: worker
          # A stand-in worker: we scale on queue DEPTH, not on the pod doing work,
          # so a sleeper is enough to demonstrate KEDA. A real worker would
          # consume + process messages (which would also drain the queue).
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["echo 'worker up'; sleep infinity"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
